        function permanentlyDeleteProject(id) {
            syncDataFromDOM(); // 先同步數據
            const p = projects.find(x => x.id === id);
            if (!p) return;
            
            // 如果有子專案，詢問是否一併徹底刪除主專案和所有子專案
            if (p.subProjects && p.subProjects.length > 0) {
                const subProjectNames = p.subProjects.map(sp => sp.name).join('、');
                const message = `此專案包含 ${p.subProjects.length} 個子專案：${subProjectNames}\n\n確定要徹底刪除此專案及其所有子專案嗎？此操作無法復原！`;
                if (confirm(message)) {
                    // 一併徹底刪除主專案（子專案會隨著主專案一起被刪除，因為它們在主專案的 subProjects 陣列中）
                    const index = projects.findIndex(x => x.id === id);
                    if (index !== -1) {
                        projects.splice(index, 1);
                        saveAllToStorage(true);
                    }
                }
            } else {
                // 沒有子專案，正常徹底刪除
                if (confirm("確定要徹底刪除此專案？此操作無法復原！")) {
                    const index = projects.findIndex(x => x.id === id);
                    if (index !== -1) {
                        projects.splice(index, 1);
                        saveAllToStorage(true);
                    }
                }
            }
        }
        
        // 檢查兩個專案是否完全相同（用於匯入時過濾重複資料）
        function isProjectDuplicate(existing, imported) {
            // 比較關鍵字段
            if (existing.name !== imported.name) return false;
            if (existing.priority !== imported.priority) return false;
            if (existing.baseDate !== imported.baseDate) return false;
            
            // 比較階段數量
            const existingStagesCount = (existing.stages || []).length;
            const importedStagesCount = (imported.stages || []).length;
            if (existingStagesCount !== importedStagesCount) return false;
            
            // 比較子專案數量
            const existingSubCount = (existing.subProjects || []).length;
            const importedSubCount = (imported.subProjects || []).length;
            if (existingSubCount !== importedSubCount) return false;
            
            // 比較階段內容（簡化比較：只比較階段名稱和數量）
            if (existingStagesCount > 0) {
                for (let i = 0; i < existingStagesCount; i++) {
                    const existingStage = existing.stages[i];
                    const importedStage = imported.stages[i];
                    if (!existingStage || !importedStage) return false;
                    if (existingStage.name !== importedStage.name) return false;
                }
            }
            
            // 如果所有關鍵字段都相同，視為重複
            return true;
        }
        function deleteStage(pId, sIdx) { 
            syncDataFromDOM(); 
            const p = projects.find(x => x.id === pId);
            let currentStages, currentStageIdx;
            
            // 如果有子專案
            if (p.subProjects && p.subProjects.length > 0) {
                // 如果選中了子專案（currentSubProjectId 不為 null）
                if (p.currentSubProjectId) {
                    const currentSub = p.subProjects.find(sp => sp.id === p.currentSubProjectId);
                    if (currentSub) {

                    } else {

                } else {
                    // 如果 currentSubProjectId 為 null，表示選擇主專案
                    currentStages = p.stages || [];

        // === 拖曳排序功能 ===
        let draggedElement = null;
        let draggedProjectId = null;
        let draggedSubProjectId = null;
        
        function handleDragStart(event, projectId, subProjectId) {
            draggedElement = event.currentTarget;
            draggedProjectId = projectId;
            draggedSubProjectId = subProjectId;
            
            // 設置拖曳效果
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/html', event.currentTarget.innerHTML);
            
            // 添加視覺回饋 - 半透明
            setTimeout(() => {
                if (draggedElement) {
                    draggedElement.style.opacity = '0.5';
                    draggedElement.style.cursor = 'move';
                }
            }, 0);
        }
        
        function handleDragEnd(event) {
            // 恢復樣式
            if (draggedElement) {
                draggedElement.style.opacity = '1';
                draggedElement.style.cursor = '';
            }
            
            // 清除所有拖曳相關的樣式
            document.querySelectorAll('.sub-project-tab').forEach(tab => {
                tab.style.borderLeft = '';
                tab.style.borderRight = '';
                tab.classList.remove('drag-over');
            });
            
            draggedElement = null;
            draggedProjectId = null;
            draggedSubProjectId = null;
        }
        
        function handleDragOver(event) {
            if (event.preventDefault) {
                event.preventDefault();
            }
            event.dataTransfer.dropEffect = 'move';
            return false;
        }
        
        function handleDragEnter(event) {
            const target = event.currentTarget;
            
            // 檢查是否可以拖曳到這個位置
            if (!target.classList.contains('sub-project-tab')) return;
            if (target === draggedElement) return;
            
            // 不允許拖曳到主專案頁籤
            const targetSubProjectId = target.dataset.subProjectId;
            if (targetSubProjectId === 'main') return;
            
            // 確保是同一個專案下的子專案
            const targetProjectId = parseInt(target.dataset.projectId);
            if (targetProjectId !== draggedProjectId) return;
            
            // 顯示插入位置提示（藍色邊框線）
            const rect = target.getBoundingClientRect();
            const mouseX = event.clientX;
            const midpoint = rect.left + rect.width / 2;
            
            if (mouseX < midpoint) {
                target.style.borderLeft = '3px solid #3b82f6';
                target.style.borderRight = '';
            } else {
                target.style.borderRight = '3px solid #3b82f6';
                target.style.borderLeft = '';
            }
        }
        
        function handleDragLeave(event) {
            const target = event.currentTarget;
            target.style.borderLeft = '';
            target.style.borderRight = '';
        }
        
        function handleDrop(event, targetProjectId, targetSubProjectId) {
            if (event.stopPropagation) {
                event.stopPropagation();
            }
            event.preventDefault();
            
            // 檢查是否是有效的拖放
            if (!draggedSubProjectId || draggedProjectId !== targetProjectId) {
                return false;
            }
            
            if (draggedSubProjectId === targetSubProjectId) {
                return false;
            }
            
            // 不允許拖放到主專案（雖然這不應該發生，但為了安全起見）
            if (targetSubProjectId === 'main') {
                return false;
            }
            
            // 更新排序
            syncDataFromDOM();
            const project = projects.find(p => p.id === targetProjectId);
            if (!project || !project.subProjects) return false;
            
            // 找到被拖曳的子專案和目標子專案
            const draggedIndex = project.subProjects.findIndex(sp => sp.id === draggedSubProjectId);
            const targetIndex = project.subProjects.findIndex(sp => sp.id === targetSubProjectId);
            
            if (draggedIndex === -1 || targetIndex === -1) return false;
            
            // 判斷插入位置（在目標之前還是之後）
            const target = event.currentTarget;
            const rect = target.getBoundingClientRect();
            const mouseX = event.clientX;
            const midpoint = rect.left + rect.width / 2;
            const insertBefore = mouseX < midpoint;
            
            // 移動子專案
            const [draggedItem] = project.subProjects.splice(draggedIndex, 1);
            let newIndex = project.subProjects.findIndex(sp => sp.id === targetSubProjectId);
            
            if (!insertBefore) {
                newIndex += 1;
            }
            
            project.subProjects.splice(newIndex, 0, draggedItem);
            
            // 重新分配 sortOrder
            project.subProjects.forEach((sp, index) => {
                sp.sortOrder = index * 1000; // 使用間隔來允許未來插入
            });
            
            // 儲存並重新渲染
            triggerChange();
            renderUI(true);
            
            return false;
        }

                    nameSpan.blur();
                }
            };
            nameSpan.addEventListener('keydown', saveOnEnter);
        }

        // ===== CALENDAR FUNCTIONS =====
        function showCalendar() {
            currentCalendarDate = new Date();
            renderCalendar();
            document.getElementById('calendar-modal').style.display = 'block';
        }

        function closeCalendar() {
            document.getElementById('calendar-modal').style.display = 'none';
        }

        function switchCalendarView(view) {
            currentCalendarView = view;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${view}`).classList.add('active');
            renderCalendar();
        }

        function navigateCalendar(direction) {
            if (currentCalendarView === 'month') {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            } else if (currentCalendarView === 'week') {
                currentCalendarDate.setDate(currentCalendarDate.getDate() + (direction * 7));
            } else {
                currentCalendarDate.setDate(currentCalendarDate.getDate() + direction);
            }
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            
            if (currentCalendarView === 'month') {
                renderMonthView(grid, title);
            } else if (currentCalendarView === 'week') {
                renderWeekView(grid, title);
            } else {
                renderDayView(grid, title);
            }
        }

        function renderMonthView(grid, title) {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const today = new Date();
            
            title.textContent = `${year}年 ${month + 1}月`;
            
            let html = '<div class="grid grid-cols-7 gap-1">';
            ['日', '一', '二', '三', '四', '五', '六'].forEach(day => {
                html += `<div class="text-center font-bold text-sm py-2">${day}</div>`;
            });
            
            const startDay = firstDay.getDay();
            for (let i = 0; i < startDay; i++) {
                const prevDate = new Date(year, month, -startDay + i + 1);
                html += generateDayCell(prevDate, true);
            }
            
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === today.toDateString();
                html += generateDayCell(date, false, isToday);
            }
            
            html += '</div>';
            grid.innerHTML = html;
        }

        function renderWeekView(grid, title) {
            const startOfWeek = new Date(currentCalendarDate);
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            
            title.textContent = `${startOfWeek.getMonth() + 1}月${startOfWeek.getDate()}日 - ${endOfWeek.getMonth() + 1}月${endOfWeek.getDate()}日`;
            
            let html = '<div class="grid grid-cols-7 gap-2">';
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(date.getDate() + i);
                const isToday = date.toDateString() === new Date().toDateString();
                html += generateDayCell(date, false, isToday, true);
            }
            html += '</div>';
            grid.innerHTML = html;
        }

        function renderDayView(grid, title) {
            const date = currentCalendarDate;
            title.textContent = `${date.getFullYear()}年 ${date.getMonth() + 1}月 ${date.getDate()}日`;
            
            const events = getEventsForDate(date);
            let html = '<div class="space-y-3">';
            
            if (events.length === 0) {
                html += '<p class="text-gray-400 text-center py-8">此日無專案事項</p>';
            } else {
                events.forEach(event => {
                    html += `
                        <div class="p-4 border rounded-xl hover:bg-gray-50">
                            <div class="font-bold text-sm mb-1">${event.projectName}</div>
                            <div class="text-xs text-gray-600">${event.stageName}</div>
                            <div class="text-[10px] text-gray-400 mt-2">優先度: ${event.priority}</div>
                        </div>
                    `;
                });
            }
            
            html += '</div>';
            grid.innerHTML = html;
        }

        function generateDayCell(date, isOtherMonth, isToday = false, isLarge = false) {
            const events = getEventsForDate(date);
            const classes = ['calendar-day'];
            if (isOtherMonth) classes.push('other-month');
            if (isToday) classes.push('today');
            
            let html = `<div class="${classes.join(' ')}">`;
            html += `<div class="font-bold text-xs mb-1">${date.getDate()}</div>`;
            
            events.slice(0, isLarge ? 5 : 2).forEach(event => {
                const priorityClass = `priority-${event.priority}`;
                html += `<div class="calendar-event ${priorityClass}" title="${event.projectName} - ${event.stageName}">${event.projectName.substring(0, 8)}${event.projectName.length > 8 ? '...' : ''}</div>`;
            });
            
            if (events.length > (isLarge ? 5 : 2)) {
                html += `<div class="text-[9px] text-gray-400 mt-1">+${events.length - (isLarge ? 5 : 2)} 更多</div>`;
            }
            
            html += '</div>';
            return html;
        }

        function getEventsForDate(date) {
            const events = [];
            const dateStr = date.toDateString();
            
            projects.filter(p => !p.isCompleted).forEach(p => {
                // 1. 顯示主專案基準日本身
                if (p.baseDate) {
                    const baseDate = new Date(p.baseDate);
                    if (baseDate.toDateString() === dateStr) {
                        events.push({
                            projectName: p.name,
                            stageName: '📍 主專案基準日',
                            priority: p.priority
                        });
                    }
                }
                
                // 2. 顯示子專案基準日
                if (p.subProjects) {
                    p.subProjects.forEach(sp => {
                        if (sp.baseDate) {
                            const subBaseDate = new Date(sp.baseDate);
                            if (subBaseDate.toDateString() === dateStr) {
                                events.push({
                                    projectName: `${p.name} - ${sp.name}`,
                                    stageName: '📍 子專案基準日',
                                    priority: p.priority
                                });
                            }
                        }
                    });
                }
                
                // 3. 只顯示當前階段的提醒日期
                const currentStages = getCurrentStages(p);
                const currentStageIdx = getCurrentStageIndex(p);
                const currentStage = currentStages && currentStages[currentStageIdx];
                if (currentStage && (currentStage.triggerType === 'main' || currentStage.triggerType === 'sub')) {
                    let baseDateStr = '';
                    if (currentStage.triggerType === 'main') {
                        // 主專案發生日前後提醒
                        baseDateStr = p.baseDate;
                    } else if (currentStage.triggerType === 'sub') {
                        // 子專案發生日前後提醒
                        if (p.currentSubProjectId) {
                            const subProject = (p.subProjects || []).find(sp => sp.id === p.currentSubProjectId);
                            if (subProject && subProject.baseDate) {
                                baseDateStr = subProject.baseDate;
                            }
                        }
                        // 如果沒有選中子專案或子專案沒有日期，使用第一個子專案的基準日
                        if (!baseDateStr && p.subProjects && p.subProjects.length > 0) {
                            const firstSub = p.subProjects[0];
                            if (firstSub && firstSub.baseDate) {
                                baseDateStr = firstSub.baseDate;
                            }
                        }
                        // 如果子專案沒有日期，回退到主專案基準日
                        if (!baseDateStr && p.baseDate) {
                            baseDateStr = p.baseDate;
                        }
                    }
                    
                    if (baseDateStr) {
                        const baseDate = new Date(baseDateStr);
                        const offset = parseInt(currentStage.time) || 0;
                        let offsetMs = 0;
                        
                        if (currentStage.unit === 'd') {
                            offsetMs = offset * 86400000;
                        } else if (currentStage.unit === 'h') {
                            offsetMs = offset * 3600000;
                        } else if (currentStage.unit === 'm') {
                            offsetMs = offset * 60000;
                        }
                        
                        // 正數 = 基準日後；負數 = 基準日前
                        const reminderDate = new Date(baseDate.getTime() + offsetMs);
                        
                        if (reminderDate.toDateString() === dateStr) {
                            events.push({
                                projectName: p.name,
                                stageName: `${currentStage.name} (第${currentStageIdx + 1}階段 - 當前)`,
                                priority: p.priority
                            });
                        }
                    }
                }
            });
            
            return events;
        }

        // ===== IMPORT FUNCTIONS =====
        function importFromCSV() {
            document.getElementById('import-modal').style.display = 'block';
        }

        function closeImport() {
            document.getElementById('import-modal').style.display = 'none';
        }

        function processImport() {
            const fileInput = document.getElementById('import-file');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('請選擇檔案');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                // 優先嘗試 JSON（完整資料）
                try {
                    const parsed = JSON.parse(text);
                    if (Array.isArray(parsed)) {
                        // 追加模式：將匯入的專案添加到現有專案中，不覆蓋
                        // 檢查重複資料，過濾掉一模一樣的專案
                        const existingIds = new Set(projects.map(p => p.id));
                        let duplicateCount = 0;
                        const newProjects = parsed.filter(p => {
                            // 檢查是否與現有專案重複
                            const isDuplicate = projects.some(existing => isProjectDuplicate(existing, p));
                            if (isDuplicate) {
                                duplicateCount++;
                                return false; // 過濾掉重複的專案
                            }
                            // 如果 ID 已存在，生成新 ID
                            if (existingIds.has(p.id)) {
                                p.id = Date.now() + Math.random();
                            }
                            existingIds.add(p.id);
                            return true;
                        });
                        projects = projects.concat(newProjects);
                        saveAllToStorage(true);
                        closeImport();
                        const message = duplicateCount > 0 
                            ? `成功匯入 ${newProjects.length} 個專案（JSON），跳過 ${duplicateCount} 個重複專案，現有專案已保留。`
                            : `成功匯入 ${newProjects.length} 個專案（JSON），現有專案已保留。`;
                        alert(message);
                        renderUI(true);
                        return;
                    }
                } catch (err) {
                    // 若非 JSON，則 fallback CSV
                }

                // CSV 匯入（每列一個階段）
                // 先正確解析 CSV，處理包含換行符的欄位
                const parseCSV = (csvText) => {
                    const lines = [];
                    let currentLine = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < csvText.length; i++) {
                        const ch = csvText[i];
                        const nextCh = csvText[i + 1];
                        
                        if (ch === '"') {
                            if (inQuotes && nextCh === '"') {
                                // 雙引號轉義
                                currentLine += '"';
                                i++; // 跳過下一個引號
                            } else {
                                // 切換引號狀態
                                inQuotes = !inQuotes;
                                currentLine += ch;
                            }
                        } else if (ch === '\n' && !inQuotes) {
                            // 不在引號內的換行符才是真正的行分隔符
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentLine = '';
                        } else {
                            currentLine += ch;
                        }
                    }
                    
                    // 添加最後一行
                    if (currentLine.trim()) {
                        lines.push(currentLine);
                    }
                    
                    return lines;
                };
                
                const lines = parseCSV(text);
                if (!lines.length) return alert('檔案內容為空');
                
                // 解析標題行
                const parseCsvLine = (line) => {
                    const cells = [];
                    let cur = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"' ) {
                            if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
                            else inQuotes = !inQuotes;
                        } else if (ch === ',' && !inQuotes) {
                            cells.push(cur);
                            cur = '';
                        } else {
                            cur += ch;
                        }
                    }
                    cells.push(cur);
                    return cells;
                };
                
                const header = parseCsvLine(lines[0]).map(h => h.replace(/(^"|"$)/g,'').trim());
                const idxOf = (key) => header.indexOf(key);
                const h = {
                    projectId: idxOf("projectId"),
                    projectName: idxOf("projectName"),
                    priority: idxOf("priority"),
                    baseDate: idxOf("baseDate"),
                    folderLink: idxOf("folderLink"),
                    isCompleted: idxOf("isCompleted"),
                    isDeleted: idxOf("isDeleted"),
                    deletedAt: idxOf("deletedAt"),
                    currentStageIndex: idxOf("currentStageIndex"),
                    currentSubProjectId: idxOf("currentSubProjectId"),
                    isMainProjectHidden: idxOf("isMainProjectHidden"),
                    note: idxOf("note"),
                    noteHeight: idxOf("noteHeight"),
                    stageStartTime: idxOf("stageStartTime"),
                    subProjectId: idxOf("subProjectId"),
                    subProjectName: idxOf("subProjectName"),
                    subProjectBaseDate: idxOf("subProjectBaseDate"),
                    subProjectCurrentStageIndex: idxOf("subProjectCurrentStageIndex"),
                    subProjectStageStartTime: idxOf("subProjectStageStartTime"),
                    subProjectIsCompleted: idxOf("subProjectIsCompleted"),
                    subProjectNote: idxOf("subProjectNote"),
                    subProjectNoteHeight: idxOf("subProjectNoteHeight"),
                    subProjectSortOrder: idxOf("subProjectSortOrder"),
                    stageIndex: idxOf("stageIndex"),
                    stageName: idxOf("stageName"),
                    triggerType: idxOf("triggerType"),
                    time: idxOf("time"),
                    unit: idxOf("unit"),
                    freqVal: idxOf("freqVal"),
                    freqUnit: idxOf("freqUnit"),
                    notified: idxOf("notified"),
                    content: idxOf("content")
                };

                const projectsMap = new Map();

                for (let i = 1; i < lines.length; i++) {
                    const cells = parseCsvLine(lines[i]).map(c => c.replace(/^\s+|\s+$/g,''));
                    if (!cells.length || cells.every(c => c === '')) continue;
                    
                    const projectId = h.projectId >= 0 && cells[h.projectId] ? cells[h.projectId] : null;
                    const projectName = h.projectName >= 0 ? cells[h.projectName] : `專案${i}`;
                    const projectKey = projectId || `${projectName}-${i}`;
                    
                    // 檢查是否有子專案 ID
                    const subProjectId = h.subProjectId >= 0 && cells[h.subProjectId] ? cells[h.subProjectId] : null;
                    
                    if (!projectsMap.has(projectKey)) {
                        const projectIdValue = projectId ? (isNaN(Number(projectId)) ? Date.now() + i : Number(projectId)) : Date.now() + i;
                        projectsMap.set(projectKey, {
                            id: projectIdValue,
                            name: projectName || `專案${i}`,
                            priority: ['急','中','緩','未開始'].includes(cells[h.priority]||'') ? cells[h.priority] : '中',
                            baseDate: h.baseDate >=0 ? cells[h.baseDate] : "",
                            folderLink: h.folderLink >=0 ? cells[h.folderLink] : "",
                            stages: [],
                            currentStageIndex: 0,
                            stageStartTime: h.stageStartTime >=0 && cells[h.stageStartTime] ? Number(cells[h.stageStartTime]) : Date.now(),
                            isCompleted: h.isCompleted>=0 ? cells[h.isCompleted] === '1' : false,
                            isDeleted: h.isDeleted>=0 ? cells[h.isDeleted] === '1' : false,
                            deletedAt: h.deletedAt>=0 && cells[h.deletedAt] ? Number(cells[h.deletedAt]) : null,
                            subProjects: [],
                            currentSubProjectId: h.currentSubProjectId >=0 && cells[h.currentSubProjectId] ? (cells[h.currentSubProjectId] ? Number(cells[h.currentSubProjectId]) : null) : null,
                            isMainProjectHidden: h.isMainProjectHidden>=0 ? cells[h.isMainProjectHidden] === '1' : false,
                            note: h.note >=0 ? cells[h.note].replace(/(^"|"$)/g,'') : '',
                            noteHeight: h.noteHeight >=0 && cells[h.noteHeight] ? Number(cells[h.noteHeight]) : null
                        });
                    }
                    
                    const proj = projectsMap.get(projectKey);
                    
                    // 更新專案的其他屬性（從第一行或最新行）
                    if (h.folderLink >=0 && cells[h.folderLink]) proj.folderLink = cells[h.folderLink];
                    if (h.currentSubProjectId >=0 && cells[h.currentSubProjectId]) {
                        const subId = cells[h.currentSubProjectId];
                        proj.currentSubProjectId = subId ? Number(subId) : null;
                    }
                    if (h.isMainProjectHidden>=0) proj.isMainProjectHidden = cells[h.isMainProjectHidden] === '1';
                    if (h.note >=0 && cells[h.note] && !subProjectId) proj.note = cells[h.note].replace(/(^"|"$)/g,'');
                    if (h.noteHeight >=0 && cells[h.noteHeight] && !subProjectId) {
                        const height = cells[h.noteHeight];
                        proj.noteHeight = height ? Number(height) : null;
                    }
                    
                    // 處理階段
                    const stageObj = {
                        name: h.stageName>=0 && cells[h.stageName] ? cells[h.stageName] : '初始階段',
                        triggerType: h.triggerType>=0 && cells[h.triggerType] ? cells[h.triggerType] : 'none',
                        time: h.time>=0 && cells[h.time] ? cells[h.time] : '1',
                        unit: h.unit>=0 && cells[h.unit] ? cells[h.unit] : 'm',
                        freqVal: h.freqVal>=0 && cells[h.freqVal] ? cells[h.freqVal] : '0',
                        freqUnit: h.freqUnit>=0 && cells[h.freqUnit] ? cells[h.freqUnit] : '永不',
                        notified: h.notified>=0 ? cells[h.notified] === '1' : false,
                        content: h.content>=0 && cells[h.content] ? cells[h.content].replace(/(^"|"$)/g,'') : ''
                    };
                    
                    // 確保 triggerType 有效
                    if (!stageObj.triggerType || !['none', 'start', 'main', 'sub'].includes(stageObj.triggerType)) {
                        stageObj.triggerType = 'none';
                    }
                    
                    // 如果有子專案 ID，這是子專案的階段
                    if (subProjectId) {
                        let subProject = proj.subProjects.find(sp => sp.id === Number(subProjectId));
                        if (!subProject) {
                            subProject = {
                                id: Number(subProjectId),
                                name: h.subProjectName >=0 && cells[h.subProjectName] ? cells[h.subProjectName] : `子專案${subProjectId}`,
                                baseDate: h.subProjectBaseDate >=0 ? cells[h.subProjectBaseDate] : "",
                                stages: [],
                                currentStageIndex: 0,
                                stageStartTime: h.subProjectStageStartTime >=0 && cells[h.subProjectStageStartTime] ? Number(cells[h.subProjectStageStartTime]) : Date.now(),
                                isCompleted: h.subProjectIsCompleted>=0 ? cells[h.subProjectIsCompleted] === '1' : false,
                                note: h.subProjectNote >=0 ? cells[h.subProjectNote].replace(/(^"|"$)/g,'') : '',
                                noteHeight: h.subProjectNoteHeight >=0 && cells[h.subProjectNoteHeight] ? Number(cells[h.subProjectNoteHeight]) : null,
                                sortOrder: h.subProjectSortOrder >=0 && cells[h.subProjectSortOrder] ? Number(cells[h.subProjectSortOrder]) : 0
                            };
                            proj.subProjects.push(subProject);
                        }
                        // 更新子專案屬性
                        if (h.subProjectName >=0 && cells[h.subProjectName]) subProject.name = cells[h.subProjectName];
                        if (h.subProjectBaseDate >=0) subProject.baseDate = cells[h.subProjectBaseDate];
                        if (h.subProjectNote >=0 && cells[h.subProjectNote]) subProject.note = cells[h.subProjectNote].replace(/(^"|"$)/g,'');
                        if (h.subProjectNoteHeight >=0 && cells[h.subProjectNoteHeight]) {
                            const height = cells[h.subProjectNoteHeight];
                            subProject.noteHeight = height ? Number(height) : null;
                        }
                        if (h.subProjectSortOrder >=0 && cells[h.subProjectSortOrder]) {
                            subProject.sortOrder = Number(cells[h.subProjectSortOrder]);
                        }
                        
                        subProject.stages.push(stageObj);
                        if (h.subProjectCurrentStageIndex >=0 && cells[h.subProjectCurrentStageIndex]) {
                            const idx = parseInt(cells[h.subProjectCurrentStageIndex]);
                            if (!isNaN(idx)) subProject.currentStageIndex = Math.min(Math.max(idx,0), subProject.stages.length-1);
                        }
                    } else {
                        // 這是主專案的階段
                        proj.stages.push(stageObj);
                        if (h.currentStageIndex >=0 && cells[h.currentStageIndex]) {
                            const idx = parseInt(cells[h.currentStageIndex]);
                            if (!isNaN(idx)) proj.currentStageIndex = Math.min(Math.max(idx,0), proj.stages.length-1);
                        }
                    }
                }

                // 追加模式：將匯入的專案添加到現有專案中，不覆蓋
                // 檢查重複資料，過濾掉一模一樣的專案
                const existingIds = new Set(projects.map(p => p.id));
                let duplicateCount = 0;
                const importedProjects = Array.from(projectsMap.values()).filter(p => {
                    // 檢查是否與現有專案重複
                    const isDuplicate = projects.some(existing => isProjectDuplicate(existing, p));
                    if (isDuplicate) {
                        duplicateCount++;
                        return false; // 過濾掉重複的專案
                    }
                    // 如果 ID 已存在，生成新 ID
                    if (existingIds.has(p.id)) {
                        p.id = Date.now() + Math.random();
                    }
                    existingIds.add(p.id);
                    return true;
                });
                projects = projects.concat(importedProjects);
                saveAllToStorage(true);
                closeImport();
                const message = duplicateCount > 0 
                    ? `成功匯入 ${importedProjects.length} 個專案（CSV），跳過 ${duplicateCount} 個重複專案，現有專案已保留。`
                    : `成功匯入 ${importedProjects.length} 個專案（CSV），現有專案已保留。`;
                alert(message);
                renderUI(true);
            };
            
            reader.onerror = function() {
                alert('讀取檔案時發生錯誤，請確認檔案格式是否正確。');
            };
            
            reader.readAsText(file, 'UTF-8');
        }

        window.onclick = function(event) {
            const calModal = document.getElementById('calendar-modal');
            const impModal = document.getElementById('import-modal');
            
            if (event.target === calModal) closeCalendar();
            if (event.target === impModal) closeImport();
        }

        initSignatureGuard();
        renderUI(true);
    </script>
